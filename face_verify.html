<!DOCTYPE html>
<html>
<head>
  <title>Face Verification</title>
</head>
<body>

<h2>Face Verification</h2>

<video id="video" width="320" height="240" autoplay></video>
<br><br>

<button onclick="captureAndVerify()">Verify Face</button>

<canvas id="canvas" width="320" height="240" style="display:none;"></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// Start camera
navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => video.srcObject = stream)
  .catch(err => alert("Camera permission denied"));

async function captureAndVerify() {
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const imageBase64 = canvas.toDataURL("image/jpeg");

  try {
    const response = await fetch("http://127.0.0.1:5000/verify-face", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: imageBase64 })
    });

    const data = await response.json();
    console.log("Face API:", data);

    if (data.status === "known") {
      alert("✅ Valid Voter: " + data.voter_id);
      window.location.href = "index.html";
    } else {
      alert("❌ Invalid Voter");
    }
  } catch (err) {
    alert("❌ Face server not reachable");
    console.error(err);
  }
}
</script>

</body>
</html>
