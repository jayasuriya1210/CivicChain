<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote - Mini Voting System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Theme Colors */
        :root {
            --primary: #2563eb;
            --accent: #0f172a;
            --surface: #ffffff;
            --muted: #f3f4f6;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
        }

        .voting-container {
            width: 100%;
            max-width: none;
            min-height: calc(100vh - 40px);
            margin: 20px auto;
            padding: 30px;
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
        }

        .voting-container::before {
            content: '';
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 2em;
            color: var(--accent);
        }

        .voting-header {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .voting-header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .voting-header p {
            font-size: 1.1em;
            opacity: 0.95;
            font-weight: 500;
        }

        .candidates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .candidate-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid var(--saffron);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .candidate-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            border-color: var(--green);
        }

        .candidate-card.selected {
            border-color: var(--green);
            background: linear-gradient(135deg, rgba(255, 153, 51, 0.1) 0%, rgba(19, 136, 8, 0.1) 100%);
            box-shadow: 0 8px 20px rgba(19, 136, 8, 0.3);
        }

        .candidate-symbol {
            font-size: 3em;
            text-align: center;
            margin-bottom: 15px;
        }

        .candidate-name {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 10px;
            text-align: center;
        }

        .candidate-party {
            color: var(--primary);
            text-align: center;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .candidate-votes {
            color: var(--primary);
            text-align: center;
            font-size: 0.9em;
            font-weight: 600;
        }

        .selection-info {
            background: rgba(255, 255, 255, 0.9);
            border-left: 4px solid var(--primary);
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            color: var(--accent);
            display: none;
            font-weight: 500;
        }

        .selection-info.show {
            display: block;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .btn-vote {
            background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
            font-size: 1.1em;
            padding: 15px 40px;
        }

        .btn-vote:hover:not(:disabled) {
            background: linear-gradient(135deg, #1d4ed8 0%, var(--primary) 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-vote:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-logout {
            background: linear-gradient(135deg, #334155 0%, #0f172a 100%);
            border: 2px solid white;
            padding: 12px 20px;
        }

        .btn-logout:hover {
            background: linear-gradient(135deg, #FF6B35 0%, var(--saffron) 100%);
        }

        .status-message {
            background: white;
            color: var(--navy);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        .status-message.success {
            background: #4CAF50;
            color: white;
            display: block;
        }

        .status-message.error {
            background: #ff6b6b;
            color: white;
            display: block;
        }

        .voter-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .voter-info-text {
            flex: 1;
        }

        .logout-btn {
            background: rgba(255, 107, 107, 0.7);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            border: none;
            color: white;
        }

        .logout-btn:hover {
            background: rgba(255, 107, 107, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .voting-container {
                margin: 20px;
                padding: 15px;
            }

            .voting-header h1 {
                font-size: 1.8em;
            }

            .candidates-grid {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body class="vote-page">
    <div class="container">
        <div class="voting-container">
            <div class="voter-info">
                <div class="voter-info-text">
                    <strong>Voter ID:</strong> <span id="voterIdDisplay"></span> | 
                    <strong>Status:</strong> <span id="statusDisplay">Verified ✓</span>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>

            <div class="voting-header">
                <h1>🗳️ Vote for Your Choice</h1>
                <p>Select a candidate and click VOTE to cast your vote</p>
                <p style="font-size: 0.9em; opacity: 0.8;">Note: You can only vote once</p>
            </div>

            <div class="status-message" id="statusMessage"></div>

            <div id="candidatesContainer" class="candidates-grid">
                <!-- Candidates will be loaded here -->
            </div>

            <div class="selection-info" id="selectionInfo">
                <strong>Selected:</strong> <span id="selectedName"></span> 
                (<span id="selectedParty"></span>)
            </div>

            <div class="button-group">
                <button class="btn-vote" id="voteBtn" onclick="submitVote()" disabled>
                    ✓ Cast Your Vote
                </button>
                <button class="btn-logout" onclick="goToResults()">
                    View Results
                </button>
            </div>
        </div>
    </div>

    <script>
        let selectedCandidate = null;
        let ws = null;

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//localhost:5000`);

            ws.onopen = () => {
                console.log('Connected to live updates');
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                if (message.type === 'candidate-added') {
                    loadCandidates();
                } else if (message.type === 'voting-reset') {
                    setTimeout(() => window.location.reload(), 1000);
                }
            };

            ws.onerror = (error) => {
                console.log('WebSocket error (non-critical):', error);
            };

            ws.onclose = () => {
                setTimeout(connectWebSocket, 5000);
            };
        }

        window.addEventListener('load', async () => {
            const token = localStorage.getItem('votingToken');
            const voterId = localStorage.getItem('voterId');

            if (!token) {
                window.location.href = '/';
                return;
            }

            document.getElementById('voterIdDisplay').textContent = voterId;
            connectWebSocket();
            await loadCandidates();
            await checkVotingStatus();
        });

        async function loadCandidates() {
            const container = document.getElementById('candidatesContainer');
            container.innerHTML = '';

            try {
                const response = await fetch('/api/vote/candidates');
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Failed to load candidates');
                }

                if (!data.candidates || data.candidates.length === 0) {
                    container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: white; padding: 40px;">No candidates available</p>';
                    return;
                }

                data.candidates.forEach((candidate) => {
                    const card = document.createElement('div');
                    card.className = 'candidate-card';
                    card.innerHTML = `
                        <div class="candidate-symbol">${candidate.symbol || '●'}</div>
                        <div class="candidate-name">${candidate.name}</div>
                        <div class="candidate-party">${candidate.party}</div>
                        <div class="candidate-votes">Votes: ${candidate.voteCount || 0}</div>
                    `;
                    card.addEventListener('click', () => selectCandidate(candidate, card));
                    container.appendChild(card);
                });
            } catch (error) {
                showStatus('Failed to load candidates: ' + error.message, 'error');
            }
        }

        function selectCandidate(candidate, element) {
            document.querySelectorAll('.candidate-card').forEach((card) => {
                card.classList.remove('selected');
            });

            element.classList.add('selected');
            selectedCandidate = candidate;

            document.getElementById('selectedName').textContent = candidate.name;
            document.getElementById('selectedParty').textContent = candidate.party;
            document.getElementById('selectionInfo').classList.add('show');
            document.getElementById('voteBtn').disabled = false;
        }

        async function submitVote() {
            if (!selectedCandidate) {
                showStatus('Please select a candidate first', 'error');
                return;
            }

            document.getElementById('voteBtn').disabled = true;
            showStatus('Casting vote...', 'info');

            const token = localStorage.getItem('votingToken');
            try {
                const response = await fetch('/api/vote/cast-vote', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        candidateId: selectedCandidate.id
                    })
                });
                const data = await response.json();

                if (response.ok) {
                    showStatus('Success: ' + data.message, 'success');
                    document.querySelectorAll('.candidate-card').forEach((card) => {
                        card.style.pointerEvents = 'none';
                        card.style.opacity = '0.6';
                    });
                    setTimeout(() => {
                        window.location.href = '/result.html';
                    }, 1500);
                } else {
                    showStatus('Error: ' + data.message, 'error');
                    document.getElementById('voteBtn').disabled = false;
                }
            } catch (error) {
                showStatus('Error casting vote: ' + error.message, 'error');
                document.getElementById('voteBtn').disabled = false;
            }
        }

        async function checkVotingStatus() {
            const token = localStorage.getItem('votingToken');
            try {
                const response = await fetch('/api/vote/voter-status', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();
                if (!response.ok) return;

                if (!data.canVote) {
                    if (data.hasVoted) {
                        showStatus('You have already voted', 'error');
                        document.querySelectorAll('.candidate-card').forEach((card) => {
                            card.style.pointerEvents = 'none';
                            card.style.opacity = '0.6';
                        });
                        document.getElementById('voteBtn').disabled = true;
                    }
                    if (!data.qrVerified) {
                        showStatus('QR verification required. Redirecting...', 'error');
                        setTimeout(() => {
                            window.location.href = 'http://localhost:3000/booth/scanner';
                        }, 2000);
                    }
                    if (!data.isVerified) {
                        showStatus('Face verification required. Redirecting...', 'error');
                        setTimeout(() => {
                            window.location.href = '/face.html';
                        }, 2000);
                    }
                }
            } catch (error) {
                console.log('Status check error (non-critical):', error);
            }
        }

        function showStatus(message, type) {
            const statusMsg = document.getElementById('statusMessage');
            statusMsg.textContent = message;
            statusMsg.className = `status-message ${type}`;
        }

        function logout() {
            localStorage.removeItem('votingToken');
            localStorage.removeItem('voterId');
            localStorage.removeItem('walletAddress');
            window.location.href = '/';
        }

        function goToResults() {
            window.location.href = '/result.html';
        }
    </script>
</body>
</html>
