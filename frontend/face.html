<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Verification -  Voting System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Theme Colors */
        :root {
            --primary: #2563eb;
            --accent: #0f172a;
            --surface: #ffffff;
            --muted: #f3f4f6;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
        }

        .face-container {
            width: 100%;
            max-width: none;
            min-height: calc(100vh - 40px);
            margin: 20px auto;
            padding: 30px;
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .face-container::before {
            content: '';
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 2em;
            color: var(--accent);
        }

        .face-container h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            font-weight: 700;
        }

        .face-container p {
            color: rgba(255, 255, 255, 0.95);
            text-align: center;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .camera-box {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
            border: 1px solid #d1d5db;
        }

        #cameraFeed {
            width: 100%;
            max-height: 400px;
            border-radius: 8px;
            background: #000;
            display: none;
        }

        .camera-placeholder {
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, #111827 0%, #374151 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            color: white;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .btn-camera {
            background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
            grid-column: 1 / 2;
        }

        .btn-camera:hover:not(:disabled) {
            background: linear-gradient(135deg, #1d4ed8 0%, var(--primary) 100%);
            transform: translateY(-2px);
        }

        .btn-capture {
            background: linear-gradient(135deg, #334155 0%, #0f172a 100%);
            grid-column: 2 / 3;
        }

        .btn-capture:hover:not(:disabled) {
            background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
            transform: translateY(-2px);
        }

        .btn-verify {
            background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
            grid-column: 1 / -1;
            margin-top: 10px;
        }

        .btn-verify:hover:not(:disabled) {
            background: #dc2626;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-box {
            background: rgba(255, 255, 255, 0.2);
            border-left: 4px solid white;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            color: white;
            display: none;
        }

        .status-box.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        .status-box.success {
            background: rgba(76, 175, 80, 0.3);
            border-left-color: #4CAF50;
        }

        .status-box.error {
            background: rgba(255, 107, 107, 0.3);
            border-left-color: #ff6b6b;
        }

        .status-box.info {
            background: rgba(0, 140, 186, 0.3);
            border-left-color: #008CBA;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-button {
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .back-button:hover {
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            .face-container {
                margin: 20px;
                padding: 20px;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            .btn-verify {
                grid-column: 1 / -1;
            }
        }
    </style>
</head>
<body class="face-page">
    <div class="container">
        <div class="face-container">
            <a href="/" class="back-button">← Back</a>
            <h1>👤 Face Verification</h1>
            <p>Please verify your face to proceed with voting</p>

            <div class="camera-box">
                <video id="cameraFeed" autoplay playsinline></video>
                <div class="camera-placeholder" id="placeholder">
                    📷
                </div>
            </div>

            <div class="button-group">
                <button class="btn-camera" id="startCameraBtn" onclick="startCamera()">
                    Start Camera
                </button>
                <button class="btn-capture" id="captureBtn" onclick="capturePhoto()" disabled>
                    Capture Photo
                </button>
                <button class="btn-verify" id="verifyBtn" onclick="verifyFace()" disabled>
                    Verify Face
                </button>
            </div>

            <div class="status-box" id="statusBox"></div>
        </div>
    </div>

    <script>
        let stream = null;
        let capturedCanvas = null;
        let qrVerified = false;
        let qrPollTimer = null;

        async function startCamera() {
            if (!qrVerified) {
                showStatus('QR verification not confirmed yet. Please wait for approval.', 'error');
                return;
            }
            try {
                showStatus('Opening camera...', 'info');
                
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                });

                const video = document.getElementById('cameraFeed');
                video.srcObject = stream;
                video.style.display = 'block';
                document.getElementById('placeholder').style.display = 'none';

                document.getElementById('startCameraBtn').disabled = true;
                document.getElementById('captureBtn').disabled = false;

                showStatus('Camera ready. Click "Capture Photo" to take your picture.', 'info');
            } catch (error) {
                showStatus('Camera access denied: ' + error.message, 'error');
            }
        }

        function capturePhoto() {
            if (!qrVerified) {
                showStatus('QR verification not confirmed yet.', 'error');
                return;
            }
            const video = document.getElementById('cameraFeed');
            const canvas = document.createElement('canvas');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);

            capturedCanvas = canvas;
            
            document.getElementById('verifyBtn').disabled = false;
            showStatus('Photo captured successfully. Click "Verify Face" to verify.', 'success');
        }

        async function verifyFace() {
            if (!qrVerified) {
                showStatus('QR verification not confirmed yet.', 'error');
                return;
            }
            if (!capturedCanvas) {
                showStatus('Please capture a photo first', 'error');
                return;
            }

            try {
                showStatus('Verifying face... <div class="loader"></div>', 'info');
                document.getElementById('verifyBtn').disabled = true;

                // Convert canvas to blob
                capturedCanvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('faceImage', blob, 'face.png');

                    const token = localStorage.getItem('votingToken');
                    const response = await fetch('http://localhost:5000/api/face/verify', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        },
                        body: formData
                    });

                    let data = null;
                    try {
                        data = await response.json();
                    } catch (e) {
                        data = null;
                    }

                    // Handle response statuses explicitly
                    if (response.status === 200) {
                        if (data && data.verified) {
                            showStatus('✅ Face Verification Successful! Redirecting...', 'success');

                            // Close camera
                            if (stream) {
                                stream.getTracks().forEach(track => track.stop());
                            }

                            // Redirect to voting page
                            setTimeout(() => {
                                window.location.href = '/vote.html';
                            }, 1500);
                        } else {
                            showStatus('❌ ' + (data?.message || 'Face verification failed. Please try again.'), 'error');
                            document.getElementById('verifyBtn').disabled = false;
                        }
                    } else if (response.status === 401) {
                        // Unauthorized - face didn't match
                        showStatus('❌ Invalid voter: face does not match the registered model.', 'error');
                        document.getElementById('verifyBtn').disabled = false;
                    } else if (response.status === 403) {
                        showStatus('❌ Access denied: ' + (data?.message || 'Registration not allowed'), 'error');
                        document.getElementById('verifyBtn').disabled = false;
                    } else if (response.status === 503) {
                        showStatus('⚠️ Face verification service unavailable. Try again later.', 'error');
                        document.getElementById('verifyBtn').disabled = false;
                    } else {
                        showStatus('❌ Verification error: ' + (data?.message || response.statusText || 'Unknown error'), 'error');
                        document.getElementById('verifyBtn').disabled = false;
                    }
                });
            } catch (error) {
                showStatus('Verification error: ' + error.message, 'error');
                document.getElementById('verifyBtn').disabled = false;
            }
        }

        function showStatus(message, type) {
            const statusBox = document.getElementById('statusBox');
            statusBox.innerHTML = message;
            statusBox.className = `status-box show ${type}`;
        }

        // Check if user is logged in
        function setQrVerified(isVerified) {
            qrVerified = isVerified === true;
            document.getElementById('startCameraBtn').disabled = !qrVerified;
            document.getElementById('captureBtn').disabled = !qrVerified;
            document.getElementById('verifyBtn').disabled = !qrVerified || !capturedCanvas;
        }

        async function checkQrStatus(token, sessionId) {
            if (!token) return false;
            if (sessionId) {
                try {
                    await fetch('/api/qr/confirm', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ sessionId })
                    });
                } catch (e) {
                    // Ignore and fall through to status check
                }
            }
            try {
                const response = await fetch('/api/qr/status', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                return response.ok && data.qrVerified;
            } catch (e) {
                return false;
            }
        }

        function startQrPolling(token, sessionId) {
            if (qrPollTimer) clearInterval(qrPollTimer);
            qrPollTimer = setInterval(async () => {
                const ok = await checkQrStatus(token, sessionId);
                if (ok) {
                    clearInterval(qrPollTimer);
                    setQrVerified(true);
                    showStatus('QR verified. You can proceed with face verification.', 'success');
                } else {
                    showStatus('Waiting for QR approval...', 'info');
                }
            }, 2000);
        }

        window.addEventListener('load', async () => {
            let token = localStorage.getItem('votingToken');
            const params = new URLSearchParams(window.location.search);
            const sessionId = params.get('sessionId');

            // If no token but sessionId provided, auto-login using QR session
            if (!token && sessionId) {
                try {
                    const qrResp = await fetch(`http://localhost:3000/booth/session-status/${encodeURIComponent(sessionId)}`);
                    const qrData = await qrResp.json();
                    if (qrResp.ok && qrData.status === 'verified' && qrData.voterId) {
                        const loginResp = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ voterId: qrData.voterId })
                        });
                        const loginData = await loginResp.json();
                        if (loginResp.ok && loginData.token) {
                            localStorage.setItem('votingToken', loginData.token);
                            localStorage.setItem('voterId', qrData.voterId);
                            token = loginData.token;
                        }
                    }
                } catch (e) {
                    // fall through to redirect below
                }
            }

            if (!token) {
                showStatus('Login required. Please login and retry.', 'error');
                setQrVerified(false);
                return;
            }

            const ok = await checkQrStatus(token, sessionId);
            if (ok) {
                setQrVerified(true);
                showStatus('QR verified. You can proceed with face verification.', 'success');
            } else {
                setQrVerified(false);
                showStatus('Waiting for QR approval...', 'info');
                startQrPolling(token, sessionId);
            }
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
