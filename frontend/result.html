<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - Mini Voting System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Theme Colors */
        :root {
            --saffron: #3b82f6;
            --white: #FFFFFF;
            --green: #2563eb;
            --navy: #0f172a;
        }

        body {
            background: linear-gradient(135deg, #FFFFFF 0%, #F5F5F5 100%);
        }

        .results-container {
            width: 100%;
            max-width: none;
            min-height: calc(100vh - 40px);
            margin: 20px auto;
            padding: 30px;
            background: linear-gradient(135deg, var(--saffron) 0%, #FFA500 50%, var(--green) 100%);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 3px solid var(--navy);
            position: relative;
        }

        .results-container::before {
            content: '☸';
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 2em;
            color: var(--navy);
        }

        .results-header {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .results-header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            border-left: 4px solid var(--green);
            padding: 20px;
            border-radius: 8px;
            color: var(--navy);
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            margin: 0 0 10px 0;
            font-size: 0.9em;
            opacity: 0.7;
            text-transform: uppercase;
            color: var(--saffron);
            font-weight: 600;
        }

        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
            color: var(--green);
        }

        .results-list {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .result-item {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: background 0.3s;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item:hover {
            background: #f9f9f9;
        }

        .result-rank {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--navy);
            min-width: 50px;
            text-align: center;
        }

        .result-info {
            flex: 1;
        }

        .result-name {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--navy);
            margin-bottom: 5px;
        }

        .result-party {
            color: var(--saffron);
            font-weight: 600;
            font-size: 0.9em;
        }

        .result-stats {
            text-align: right;
            min-width: 150px;
        }

        .result-votes {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--green);
            margin-bottom: 5px;
        }

        .result-percentage {
            color: var(--navy);
            font-size: 0.9em;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--saffron) 0%, var(--green) 100%);
            border-radius: 4px;
            transition: width 0.3s;
        }

        .winner-badge {
            background: #FFD700;
            color: var(--navy);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            margin-left: 10px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .btn-vote-again {
            background: linear-gradient(135deg, var(--green) 0%, #0d6b06 100%);
        }

        .btn-vote-again:hover {
            background: linear-gradient(135deg, #0d6b06 0%, var(--green) 100%);
            transform: translateY(-2px);
        }

        .btn-home {
            background: linear-gradient(135deg, var(--saffron) 0%, #FF6B35 100%);
            border: 2px solid white;
        }

        .btn-home:hover {
            background: linear-gradient(135deg, #FF6B35 0%, var(--saffron) 100%);
        }

        .success-message {
            background: linear-gradient(135deg, var(--green) 0%, #0d6b06 100%);
            border-left: 4px solid var(--green);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            color: white;
            text-align: center;
            font-size: 1.1em;
            animation: slideIn 0.3s ease-out;
            font-weight: 600;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .results-container {
                margin: 20px;
                padding: 15px;
            }

            .results-header h1 {
                font-size: 1.8em;
            }

            .result-item {
                flex-direction: column;
                text-align: center;
            }

            .result-stats {
                text-align: center;
                min-width: unset;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body class="results-page">
    <div class="container">
        <div class="results-container">
            <div class="results-header">
                <h1>📊 Election Results</h1>
                <p>Live voting results</p>
            </div>

            <div class="success-message" id="successMessage" style="display: none;">
                ✅ Your vote has been successfully recorded!
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Votes</h3>
                    <div class="value" id="totalVotes">0</div>
                </div>
                <div class="stat-card">
                    <h3>Candidates</h3>
                    <div class="value" id="totalCandidates">0</div>
                </div>
                <div class="stat-card">
                    <h3>Election Status</h3>
                    <div class="value" id="votingStatus">Active</div>
                </div>
            </div>

            <h2 style="color: white; margin-top: 30px; margin-bottom: 15px;">🏆 Candidate Rankings</h2>
            <div class="results-list" id="resultsList">
                <!-- Results will be loaded here -->
            </div>

            <div class="button-group">
                <button class="btn-vote-again" onclick="goToVote()">
                    ← Back to Voting
                </button>
                <button class="btn-home" onclick="logout()">
                    Logout
                </button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;

        // Connect to WebSocket for real-time updates
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//localhost:5000`);

            ws.onopen = () => {
                console.log('✓ Connected to live results');
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                
                if (message.type === 'vote-cast' || message.type === 'candidate-added') {
                    console.log('📊 Update received:', message.type);
                    loadResults(); // Refresh results immediately when vote is cast
                }
            };

            ws.onerror = (error) => {
                console.log('WebSocket error (non-critical):', error);
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected, retrying in 5 seconds...');
                setTimeout(connectWebSocket, 5000);
            };
        }

        window.addEventListener('load', async () => {
            // Check if user just voted
            const justVoted = sessionStorage.getItem('justVoted');
            if (justVoted) {
                document.getElementById('successMessage').style.display = 'block';
                sessionStorage.removeItem('justVoted');
            }

            // Connect to WebSocket
            connectWebSocket();

            // Load results
            await loadResults();

            // Refresh results every 5 seconds as fallback
            setInterval(loadResults, 5000);
        });

        async function loadResults() {
            try {
                const response = await fetch('/api/vote/results');
                const data = await response.json();

                // Update stats
                document.getElementById('totalVotes').textContent = data.totalVotes || 0;
                document.getElementById('totalCandidates').textContent = data.totalCandidates || data.results.length || 0;

                // Display results
                const resultsList = document.getElementById('resultsList');
                resultsList.innerHTML = '';

                if (data.results.length === 0) {
                    resultsList.innerHTML = '<div style="padding: 40px; text-align: center; color: #999;">No results yet</div>';
                    return;
                }

                data.results.forEach((result, index) => {
                    const percentage = parseFloat(result.percentage) || 0;
                    const isWinner = index === 0 && data.totalVotes > 0;

                    const resultItem = document.createElement('div');
                    resultItem.className = 'result-item';
                    resultItem.innerHTML = `
                        <div class="result-rank">#${index + 1}</div>
                        <div class="result-info">
                            <div class="result-name">
                                ${result.symbol || '●'} ${result.name}
                                ${isWinner ? '<span class="winner-badge">LEADING</span>' : ''}
                            </div>
                            <div class="result-party">${result.party}</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${Math.min(percentage, 100)}%"></div>
                            </div>
                        </div>
                        <div class="result-stats">
                            <div class="result-votes">${result.voteCount}</div>
                            <div class="result-percentage">${percentage}%</div>
                        </div>
                    `;

                    resultsList.appendChild(resultItem);
                });
            } catch (error) {
                console.error('Error loading results:', error);
                document.getElementById('resultsList').innerHTML = 
                    '<div style="padding: 40px; text-align: center; color: #ff6b6b;">Failed to load results</div>';
            }
        }

        function goToVote() {
            window.location.href = '/vote.html';
        }

        function logout() {
            localStorage.removeItem('votingToken');
            localStorage.removeItem('voterId');
            localStorage.removeItem('walletAddress');
            window.location.href = '/';
        }
    </script>
</body>
</html>
