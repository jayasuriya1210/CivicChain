<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting System - Voter Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Theme Colors */
        :root {
            --primary: #2563eb;
            --accent: #0f172a;
            --surface: #ffffff;
            --muted: #f3f4f6;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
        }

        .login-container {
            width: 100%;
            max-width: none;
            min-height: calc(100vh - 40px);
            margin: 20px auto;
            padding: 30px;
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            border-radius: 12px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
            animation: slideIn 0.5s ease-out;
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 2.5em;
            color: var(--accent);
        }

        /* Landscape-first layout */
        @media (orientation: landscape) {
            .login-container {
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 30px;
                padding: 10px 40px;
            }

            .login-container .logo,
            .login-container .info-box {
                flex: 1 1 40%;
            }

            .login-container form {
                flex: 1 1 60%;
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            font-weight: 700;
        }

        .login-container p {
            color: rgba(255, 255, 255, 0.95);
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9em;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            color: var(--accent);
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.9);
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 0.9em;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 1em;
            box-sizing: border-box;
            transition: all 0.3s;
            color: var(--accent);
            background: white;
            font-weight: 600;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.3);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
            color: white;
            margin-bottom: 15px;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, var(--primary) 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-admin {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            font-weight: 600;
        }

        .btn-admin:hover {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .info-box {
            background: rgba(255, 255, 255, 0.95);
            border-left: 4px solid var(--primary);
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            color: var(--accent);
            font-size: 0.9em;
            font-weight: 500;
        }

        .error {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff5555 100%);
            color: white;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
            animation: slideIn 0.3s;
            font-weight: 600;
            border-left: 4px solid #ff3333;
        }

        .error.show {
            display: block;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
            font-size: 3em;
        }

        @media (max-width: 600px) {
            .login-container {
                margin: 10px auto;
                padding: 20px;
                min-height: calc(100vh - 20px);
            }
        }
    </style>
</head>
<body class="login-page">
    <div class="container">
        <div class="login-container">
            <div class="logo">🗳️</div>
            <h1>Voting System</h1>
            <p>Secure Voting System</p>
            
            <div class="error" id="loginError"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="voterId">Voter ID (12 Digits)</label>
                    <input 
                        type="text" 
                        id="voterId" 
                        name="voterId" 
                        placeholder="Enter your 12-digit voter ID"
                        maxlength="12"
                        inputmode="numeric"
                        required
                    >
                </div>

                <!-- Wallet address removed: login uses only Voter ID + face verification -->

                <button type="submit" class="btn-login">
                    <span id="loginBtnText">Login</span>
                    <span id="loginLoader" style="display: none;">Loading...</span>
                </button>

                <div class="btn-group">
                    <button type="button" class="btn-admin" onclick="goToAdmin()">
                        QR Admin Dashboard
                    </button>
                    <button type="button" class="btn-admin" onclick="goToRegister()">
                        Register (QR)
                    </button>
                </div>
            </form>

                <div class="info-box">
                <strong>ℹ️ Demo Information:</strong><br>
                • Use your 12-digit voter ID<br>
                • QR verification happens before face verification<br>
                • Secure, audit-friendly flow
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const voterId = document.getElementById('voterId').value.trim();

            // Validation
            if (voterId.length !== 12 || !/^\d{12}$/.test(voterId)) {
                showError('Voter ID must be exactly 12 digits');
                return;
            }

            try {
                showLoading(true);

                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ voterId: voterId })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.message || 'Login failed');
                    return;
                }

                // Save token and voter info
                localStorage.setItem('votingToken', data.token);
                localStorage.setItem('voterId', voterId);

                // Redirect to QR verification
                window.location.href = `http://localhost:3000/qr/display?voterId=${encodeURIComponent(voterId)}`;
            } catch (error) {
                showError('Connection error. Please check backend status.');
                console.error('Login error:', error);
            } finally {
                showLoading(false);
            }
        });

        function showError(message) {
            loginError.textContent = message;
            loginError.classList.add('show');
            setTimeout(() => {
                loginError.classList.remove('show');
            }, 5000);
        }

        function showLoading(isLoading) {
            document.getElementById('loginBtnText').style.display = isLoading ? 'none' : 'inline';
            document.getElementById('loginLoader').style.display = isLoading ? 'inline' : 'none';
            loginForm.querySelector('button[type="submit"]').disabled = isLoading;
        }

        function goToAdmin() {
            window.location.href = 'http://localhost:5000/admin.html';
        }

        function goToRegister() {
            window.location.href = 'http://localhost:3000/register';
        }

        // Format voter ID input
        document.getElementById('voterId').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '').substring(0, 12);
        });
    </script>
</body>
</html>
