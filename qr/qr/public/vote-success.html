<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote Cast Successfully!</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #064e3b, #065f46, #047857);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }

    .checkmark {
      font-size: 72px;
      margin-bottom: 20px;
      animation: pop .5s cubic-bezier(.36, 0, .66, -.56) reverse;
    }

    @keyframes pop {
      from {
        transform: scale(0);
      }

      to {
        transform: scale(1);
      }
    }

    h1 {
      color: #fff;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .sub {
      color: rgba(255, 255, 255, 0.6);
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .receipt {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 28px;
    }

    .receipt p {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 6px;
    }

    .receipt code {
      font-size: 13px;
      color: #6ee7b7;
      word-break: break-all;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      transition: all .25s;
    }

    .btn-white {
      background: #fff;
      color: #047857;
      margin-bottom: 10px;
    }

    .btn-white:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .c {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      from {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }

      to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="confetti" id="confetti"></div>
  <div class="card">
    <div class="checkmark">✅</div>
    <h1>Vote Recorded!</h1>
    <p class="sub">Your vote has been securely recorded. Thank you for participating in the democratic process.</p>
    <div class="receipt" id="receiptBox" style="display:none;">
      <p>Receipt ID</p>
      <code id="receiptId">—</code>
    </div>
    <a href="/" class="btn btn-white">🏠 Back to Home</a>
    <a href="#" class="btn btn-outline" onclick="window.close()">Close Window</a>
  </div>
  <script>
    // Show receipt if stored
    const receipt = sessionStorage.getItem('voteReceipt');
    if (receipt) {
      document.getElementById('receiptId').textContent = receipt;
      document.getElementById('receiptBox').style.display = 'block';
    }

    // Confetti
    const colors = ['#6ee7b7', '#fcd34d', '#93c5fd', '#f9a8d4', '#a5b4fc'];
    const c = document.getElementById('confetti');
    for (let i = 0; i < 60; i++) {
      const el = document.createElement('div');
      el.className = 'c';
      el.style.cssText = `left:${Math.random() * 100}%;background:${colors[i % 5]};animation-duration:${2 + Math.random() * 3}s;animation-delay:${Math.random() * 2}s;width:${6 + Math.random() * 10}px;height:${6 + Math.random() * 10}px;`;
      c.appendChild(el);
    }
  </script>
</body>

</html>
