<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booth Scanner – QR Voting System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 36px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #fff;
            font-size: 22px;
            margin-bottom: 4px;
            text-align: center;
        }

        .sub {
            color: rgba(255, 255, 255, 0.45);
            font-size: 13px;
            text-align: center;
            margin-bottom: 28px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: .5px;
            display: block;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 12px 14px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 16px;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #22d3ee;
            background: rgba(34, 211, 238, 0.08);
        }

        select option {
            background: #1e3a4a;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all .25s;
            margin-top: 4px;
        }

        .btn-scan {
            background: linear-gradient(135deg, #06b6d4, #0e7490);
            color: #fff;
        }

        .btn-scan:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.4);
        }

        .btn-scan:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.4);
            color: #ff8080;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #86efac;
        }

        .alert-info {
            background: rgba(34, 211, 238, 0.15);
            border: 1px solid rgba(34, 211, 238, 0.3);
            color: #67e8f9;
        }

        .result-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .result-box.show {
            display: block;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            font-size: 13px;
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-label {
            color: rgba(255, 255, 255, 0.45);
        }

        .result-value {
            color: #fff;
            font-weight: 500;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-pending {
            background: rgba(250, 204, 21, 0.2);
            color: #facc15;
        }

        .status-verified {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .status-rejected {
            background: rgba(248, 113, 113, 0.2);
            color: #f87171;
        }

        .polling-section {
            text-align: center;
            margin-top: 20px;
        }

        .camera-box {
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
        }

        .camera-feed {
            width: 100%;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.25);
            min-height: 220px;
            object-fit: cover;
        }

        .camera-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .upload-box {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed rgba(255, 255, 255, 0.18);
        }

        .upload-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .file-input {
            flex: 1;
            margin: 0;
            padding: 8px 10px;
            font-size: 12px;
        }

        .upload-btn {
            width: auto;
            margin: 0;
            padding: 10px 12px;
            font-size: 13px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer;
        }

        .camera-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
        }

        .camera-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .poll-btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #aaa;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>📡 Booth QR Scanner</h1>
        <p class="sub">Show voter QR in camera to start admin verification</p>

        <div id="alertBox" class="alert"></div>

        <div>
            <div class="camera-box">
                <label>Scan With Webcam</label>
                <video id="cameraFeed" class="camera-feed" autoplay playsinline muted></video>
                <div class="camera-actions">
                    <button class="camera-btn" id="startCameraBtn" onclick="startCameraScan()">🎥 Start Camera</button>
                    <button class="camera-btn" id="stopCameraBtn" onclick="stopCameraScan()" disabled>⏹ Stop Camera</button>
                </div>
                <div class="upload-box">
                    <label>Or Upload QR Image</label>
                    <div class="upload-row">
                        <input class="file-input" id="qrImageInput" type="file" accept="image/*">
                        <button class="upload-btn" type="button" onclick="scanUploadedImage()">Scan Image</button>
                    </div>
                </div>
            </div>

            <label>Booth ID</label>
            <select id="boothId">
                <option value="BOOTH-CC-01">BOOTH-CC-01</option>
                <option value="BOOTH-CC-02">BOOTH-CC-02</option>
                <option value="BOOTH-CN-01">BOOTH-CN-01</option>
                <option value="BOOTH-CS-01">BOOTH-CS-01</option>
            </select>

            <button class="btn btn-scan" id="scanBtn" onclick="startCameraScan()">Start QR Scan</button>
        </div>

        <div class="result-box" id="resultBox">
            <div class="result-row"><span class="result-label">Session ID</span><span class="result-value"
                    id="rSession">—</span></div>
            <div class="result-row"><span class="result-label">Voter ID</span><span class="result-value"
                    id="rVoter">—</span></div>
            <div class="result-row"><span class="result-label">Status</span><span class="result-value"
                    id="rStatus">—</span></div>
        </div>

        <div class="polling-section" id="pollingSection" style="display:none;">
            <p style="color:rgba(255,255,255,0.5); font-size:13px; margin-bottom:12px;">Waiting for admin to approve…
            </p>
            <button class="poll-btn" onclick="checkStatus()">🔄 Refresh Status</button>
        </div>

        <div style="text-align:center; margin-top:24px;">
            <a href="/" style="color:rgba(255,255,255,0.35); font-size:12px; text-decoration:none;">← Back to Home</a>
        </div>
    </div>

        <script>
        let currentSessionId = null;
        let pollTimer = null;
        let cameraStream = null;
        let cameraLoopId = null;
        let isProcessingScan = false;
        const scanCanvas = document.createElement('canvas');
        const scanCtx = scanCanvas.getContext('2d');
        const uploadImage = new Image();

        async function verifyScannedToken(rawInput) {
            const boothId = document.getElementById('boothId').value;
            if (!rawInput) {
                showAlert('No QR token detected.', 'error');
                return;
            }

            let token = rawInput;
            const verifyMarker = '/qr/verify/';
            if (rawInput.includes(verifyMarker)) {
                token = rawInput.split(verifyMarker).pop().trim();
            }

            const btn = document.getElementById('scanBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Verifying...';
            hideAlert();

            try {
                const r = await fetch('/booth/scan-qr', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, boothId })
                });
                const d = await r.json();

                if (!r.ok) {
                    showAlert(d.error || 'Verification failed', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Start QR Scan';
                    isProcessingScan = false;
                    return;
                }

                currentSessionId = d.sessionId;
                document.getElementById('rSession').textContent = d.sessionId;
                document.getElementById('rVoter').textContent = 'Awaiting admin validation';
                document.getElementById('rStatus').innerHTML = '<span class="status-badge status-pending">Pending</span>';
                document.getElementById('resultBox').classList.add('show');
                document.getElementById('pollingSection').style.display = 'block';

                showAlert('QR verified. Waiting for admin approval...', 'info');
                btn.disabled = false;
                btn.textContent = 'Start QR Scan';
                isProcessingScan = false;

                clearInterval(pollTimer);
                pollTimer = setInterval(checkStatus, 3000);
            } catch (e) {
                showAlert('Network error: ' + e.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Start QR Scan';
                isProcessingScan = false;
            }
        }

        async function checkStatus() {
            if (!currentSessionId) return;
            try {
                const r = await fetch('/booth/session-status/' + currentSessionId);
                const d = await r.json();
                if (!r.ok) return;

                const s = d.status;
                let badge = '';
                if (s === 'pending') badge = '<span class="status-badge status-pending">Pending Admin Approval</span>';
                if (s === 'verified') badge = '<span class="status-badge status-verified">Approved - Voter may vote</span>';
                if (s === 'rejected') badge = '<span class="status-badge status-rejected">Rejected</span>';
                if (s === 'completed') badge = '<span class="status-badge status-verified">Vote Cast Successfully</span>';

                document.getElementById('rStatus').innerHTML = badge;
                document.getElementById('rVoter').textContent = d.voterDetails?.name || d.voterId;

                if (s === 'verified' || s === 'rejected' || s === 'completed') {
                    clearInterval(pollTimer);
                    document.getElementById('pollingSection').style.display = 'none';
                    if (s === 'verified') {
                        showAlert('Admin approved. Opening face verification...', 'success');
                        localStorage.setItem('latestSessionId', currentSessionId);
                        setTimeout(() => {
                            window.location.href = 'http://localhost:5000/face.html?sessionId=' + encodeURIComponent(currentSessionId);
                        }, 900);
                    }
                    if (s === 'rejected') showAlert('Admin rejected this voter.', 'error');
                }
            } catch (e) { }
        }

        async function startCameraScan() {
            const startBtn = document.getElementById('startCameraBtn');
            const stopBtn = document.getElementById('stopCameraBtn');
            const video = document.getElementById('cameraFeed');

            if (cameraStream) {
                return;
            }

            try {
                if (typeof jsQR === 'undefined') {
                    showAlert('QR scanner library not loaded.', 'error');
                    return;
                }
                hideAlert();
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                video.srcObject = cameraStream;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                showAlert('Camera started. Point it at the voter QR code...', 'info');
                scanFromCamera();
            } catch (e) {
                showAlert('Could not access webcam: ' + e.message, 'error');
            }
        }

        function stopCameraScan() {
            const startBtn = document.getElementById('startCameraBtn');
            const stopBtn = document.getElementById('stopCameraBtn');
            const video = document.getElementById('cameraFeed');

            if (cameraLoopId) {
                cancelAnimationFrame(cameraLoopId);
                cameraLoopId = null;
            }
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
            }
            video.srcObject = null;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            isProcessingScan = false;
        }

        function scanFromCamera() {
            const video = document.getElementById('cameraFeed');
            if (!cameraStream) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0 && video.videoHeight > 0) {
                scanCanvas.width = video.videoWidth;
                scanCanvas.height = video.videoHeight;
                scanCtx.drawImage(video, 0, 0, scanCanvas.width, scanCanvas.height);
                const imageData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: 'attemptBoth'
                });

                if (code && code.data && !isProcessingScan) {
                    isProcessingScan = true;
                    stopCameraScan();
                    showAlert('QR detected. Verifying...', 'info');
                    verifyScannedToken(code.data);
                    return;
                }
            }
            cameraLoopId = requestAnimationFrame(scanFromCamera);
        }

        function scanUploadedImage() {
            const fileInput = document.getElementById('qrImageInput');
            const file = fileInput.files && fileInput.files[0];
            if (!file) {
                showAlert('Please choose a QR image file first.', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = () => {
                uploadImage.onload = () => {
                    scanCanvas.width = uploadImage.width;
                    scanCanvas.height = uploadImage.height;
                    scanCtx.drawImage(uploadImage, 0, 0, scanCanvas.width, scanCanvas.height);
                    const imgData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
                    const code = jsQR(imgData.data, imgData.width, imgData.height, {
                        inversionAttempts: 'attemptBoth'
                    });

                    if (!code || !code.data) {
                        showAlert('QR not detected in uploaded image. Try a clearer image.', 'error');
                        return;
                    }

                    stopCameraScan();
                    showAlert('QR detected from image. Verifying...', 'info');
                    verifyScannedToken(code.data);
                };
                uploadImage.onerror = () => {
                    showAlert('Invalid image file.', 'error');
                };
                uploadImage.src = reader.result;
            };
            reader.onerror = () => showAlert('Could not read image file.', 'error');
            reader.readAsDataURL(file);
        }

        function showAlert(msg, type) {
            const el = document.getElementById('alertBox');
            el.textContent = msg;
            el.className = 'alert show alert-' + type;
        }

        function hideAlert() {
            document.getElementById('alertBox').classList.remove('show');
        }

        window.addEventListener('beforeunload', () => {
            stopCameraScan();
        });

        window.addEventListener('load', () => {
            startCameraScan();
        });
    </script>
</body>

</html>
