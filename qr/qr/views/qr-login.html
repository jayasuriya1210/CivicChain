<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Login - Voting System</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; margin: 0; background: #f6f9fc; }
    .container { max-width: 900px; margin: 40px auto; padding: 20px; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 24px; }
    h1 { margin: 0 0 8px; }
    p.sub { color: #555; margin-top: 0; }
    #reader { width: 100%; max-width: 480px; margin: 20px auto; }
    .status { text-align: center; margin-top: 16px; font-weight: 600; }
    .ok { color: #1b5e20; }
    .err { color: #b71c1c; }
    .actions { text-align: center; margin-top: 24px; }
    .btn { background: linear-gradient(to right, #FF9933, #138808); color: #fff; border: none; padding: 12px 20px; border-radius: 999px; cursor: pointer; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .hint { text-align: center; color: #777; font-size: 14px; }
    .controls { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
    select, input[type="file"] { padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
  </style>
  <script src="https://unpkg.com/html5-qrcode@2.3.9/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Scan your QR to Continue</h1>
      <p class="sub">Use your device camera to scan the unique credential QR. Your credential will be verified securely.</p>
      <div class="controls">
        <select id="cameraSelect" aria-label="Camera selection"></select>
        <button id="startBtn" class="btn">Start Camera</button>
        <button id="stopBtn" class="btn" disabled>Stop</button>
        <button id="integratedBtn" class="btn" title="Use laptop front camera">Use Integrated Camera</button>
        <input id="fileInput" type="file" accept="image/*" />
      </div>
      <video id="video" playsinline autoplay muted style="width: 100%; max-width: 480px; border-radius: 12px; background:#000;"></video>
      <div id="status" class="status">Awaiting scan…</div>
      <div class="actions">
        <button id="proceedBtn" class="btn" disabled onclick="window.location.href='user-details-form.html'">Complete Registration</button>
      </div>
      <p class="hint">Having trouble? Ensure camera permission is granted and the QR is well lit.</p>
    </div>
  </div>

  <script src="../assets/js/qr-login.js"></script>
</body>
</html>
